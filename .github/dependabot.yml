version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

# The "docker" ecosystem is intentionally absent. Dependabot cannot page
# through public.ecr.aws tag listings (the registry answers the pagination
# request with 401 and the updater fails with status 429), so every weekly
# run would fail. The Dockerfile base images are pinned to exact versions
# and reviewed manually instead.
