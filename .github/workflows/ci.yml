# Fork-safe CI: the pinned SDK mirror makes every source and image check work
# without repository secrets. Publishing remains exclusive to release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, vet, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            third_party/nereidlink/sdk/device/go/go.sum

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Verify source
        run: make verify

  package:
    name: Package multi-architecture image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No proxy/mirror job env: the runner builds pristine and the empty
    # Dockerfile/Makefile defaults resolve to the toolchain upstream.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare the OCI image build
        id: image
        shell: bash
        run: |
          set -euo pipefail
          # Branch/PR builds always use the rolling dev channel; the tag
          # release workflow derives bare SemVer from the git tag instead.
          version="0.0.0-dev"
          archive="dist/images/nereidedge-${version}-multiarch.oci.tar"
          mkdir -p "$(dirname "${archive}")"
          rm -f "${archive}"
          {
            echo "archive=${archive}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            echo "ghcr.io/nereidai/nereidedge:${version}"
            echo "ghcr.io/nereidai/nereidedge:${version}-$(date -u +%Y%m%d-%H%M)"
            echo "ghcr.io/nereidai/nereidedge:${version}-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and cache the OCI image archive
        # The action provides the GitHub runtime integration required by the
        # gha cache backend, which a plain shell buildx invocation does not.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ steps.image.outputs.archive }}
          build-args: |
            VERSION=0.0.0-dev
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.image.outputs.build_date }}
            GOPROXY=
            ALPINE_MIRROR=
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.tags }}

      - name: Verify the OCI image archive
        run: ./bin/test-oci-image.sh "${{ steps.image.outputs.archive }}" linux/amd64,linux/arm64

      - name: Upload OCI archive
        uses: actions/upload-artifact@v4
        with:
          name: nereidedge-multiarch-${{ github.sha }}
          path: dist/images/*.oci.tar
          if-no-files-found: error
          retention-days: 7
